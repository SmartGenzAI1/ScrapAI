services:
  - type: web
    name: scrapai-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && (cd frontend && npm install && npm run build)
    startCommand: python backend/main.py
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./scrapai.db
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"

  - type: worker
    name: scrapai-telegram
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_URL
        fromService:
          type: web
          name: scrapai-api
          property: host
